# =============================================================================
# WARIANT R (referencyjny) - wariant N uzupelniony o mechanizmy ekosystemowe
# do uzyskania pelnego pokrycia klas kontroli oraz mechanizmow zabezpieczajacych
# sam proces wytworczy.
#
# Kazde zadanie oznaczono etykieta [N] lub [E] zgodnie z kwalifikacja z zalacznika B.
# =============================================================================

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/SAST-IaC.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml
  - template: Security/DAST.gitlab-ci.yml

default:
  tags:
    - docker

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  OBRAZ: "$CI_REGISTRY_IMAGE/juice-shop"
  ZNACZNIK: "$CI_COMMIT_SHORT_SHA"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm-nocache"

  # --- magazyn poswiadczen (grupa W5) --------------------------------------
  VAULT_AUTH_ROLE: badanie-potok
  VAULT_AUTH_PATH: jwt

  # --- statyczna analiza kodu (klasa: sast) --------------------------------
  GITLAB_ADVANCED_SAST_ENABLED: 'true'
  SAST_EXCLUDED_PATHS: "test,tests,spec,node_modules,build"

  # --- wykrywanie sekretow (klasa: sekrety) --------------------------------
  SECRET_DETECTION_HISTORIC_SCAN: 'true'
  GIT_DEPTH: "100"

  # --- skanowanie obrazu (klasa: kontenery) --------------------------------
  CS_IMAGE: "$CI_REGISTRY_IMAGE/juice-shop:$CI_COMMIT_SHORT_SHA"
  CS_DOCKERFILE_PATH: "Dockerfile"

  # --- dynamiczne testowanie (klasa: dast) ---------------------------------
  DAST_TARGET_URL: "https://owasp-$CI_PIPELINE_ID.opscentre.pl"

  # --- proweniencja artefaktow (grupa W5) ----------------------------------
  RUNNER_GENERATE_ARTIFACTS_METADATA: 'true'

  # -----------------------------------------------------------------------
  # SEC-04 | CWE-798 | faza 3
  # -----------------------------------------------------------------------
  LEGACY_MONITORING_TOKEN: "glpat-a1B2c3D4e5F6g7H8i9J0"

  # --- wersje narzedzi ekosystemowych (grupa W5 / badania) ----------------
  WERSJA_SEMGREP: "1.97.0"
  WERSJA_TRIVY: "0.58.1"
  WERSJA_GITLEAKS: "8.22.1"
  WERSJA_SYFT: "1.19.0"
  WERSJA_COSIGN: "2.4.1"
  WERSJA_ZAP: "2.16.0"

# Szablon uwierzytelniania w HashiCorp Vault dla zadan k8s
.k8s_vault:
  image:
    name: bitnami/kubectl
    entrypoint: [""]
  id_tokens:
    VAULT_ID_TOKEN:
      aud: "$VAULT_SERVER_URL"
  secrets:
    KUBECONFIG_PRODUKCJA:
      vault: badanie/kubernetes/kubeconfig@kv
      token: $VAULT_ID_TOKEN
      file: true
  before_script:
    - export KUBECONFIG="$KUBECONFIG_PRODUKCJA"

stages:
  - budowanie
  - test
  - test-krzyzowy
  - obraz
  - artefakt
  - srodowisko-efemeryczne
  - dast
  - sprzatanie
  - weryfikacja
  - wdrozenie

# =============================================================================
# ETAP BUDOWANIA
# =============================================================================
budowanie:
  stage: budowanie
  image: node:22.23
  needs: []
  script:
    - npm install --no-audit --no-fund
    - npm run build
  artifacts:
    paths:
      - build/
      - frontend/dist/
    expire_in: 1 day

# =============================================================================
# [N] ANALIZY NATYWNE
# =============================================================================
sast:
  stage: test
  needs: []

gitlab-advanced-sast:
  stage: test
  needs: []

kics-iac-sast:
  stage: test
  needs: []

secret_detection:
  stage: test
  needs: []
  variables:
    GIT_DEPTH: "100"

dependency-scanning:
  stage: test
  needs: [budowanie]

# =============================================================================
# [E] KONTROLA KRZYZOWA (KOD I IAC)
# =============================================================================
semgrep-krzyzowy:
  stage: test-krzyzowy
  image: 
    name: returntocorp/semgrep:$WERSJA_SEMGREP
    entrypoint: [""]
  needs: []
  allow_failure: true
  script:
    - semgrep --config=p/security-audit --config=p/owasp-top-ten
      --sarif --output semgrep.sarif --metrics=off .
  artifacts:
    paths: [semgrep.sarif]
    when: always
    expire_in: 1 week

gitleaks-krzyzowy:
  stage: test-krzyzowy
  image: 
    name: zricethezav/gitleaks:v$WERSJA_GITLEAKS
    entrypoint: [""]
  needs: []
  allow_failure: true
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks detect --source . --report-format sarif --report-path gitleaks.sarif --exit-code 0
  artifacts:
    paths: [gitleaks.sarif]
    when: always
    expire_in: 1 week

trivy-iac-krzyzowy:
  stage: test-krzyzowy
  image: 
    name: aquasec/trivy:$WERSJA_TRIVY
    entrypoint: [""]
  needs: []
  allow_failure: true
  script:
    - trivy config --format sarif --output trivy-iac.sarif --exit-code 0 .
  artifacts:
    paths: [trivy-iac.sarif]
    when: always
    expire_in: 1 week

# =============================================================================
# BUDOWA I SKANOWANIE OBRAZU
# =============================================================================
obraz:
  stage: obraz
  image: docker:27-dind
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  needs: [budowanie]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$OBRAZ:$ZNACZNIK" .
    - docker push "$OBRAZ:$ZNACZNIK"
    - docker image inspect "$OBRAZ:$ZNACZNIK" --format '{{index .RepoDigests 0}}' > skrot-obrazu.txt
  artifacts:
    paths:
      - skrot-obrazu.txt
      - artifacts-metadata.json
    expire_in: 1 week

container_scanning:
  stage: obraz
  needs: [obraz]

trivy-obraz-krzyzowy:
  stage: obraz
  image: 
    name: aquasec/trivy:$WERSJA_TRIVY
    entrypoint: [""]
  needs: [obraz]
  allow_failure: true
  script:
    - trivy image --format sarif --output trivy-obraz.sarif --exit-code 0 "$OBRAZ:$ZNACZNIK"
  artifacts:
    paths: [trivy-obraz.sarif]
    when: always
    expire_in: 1 week

# =============================================================================
# [E] ZESTAWIENIE KOMPONENTOW (SBOM) I PODPIS (COSIGN)
# =============================================================================
sbom:
  stage: artefakt
  image: alpine:3.20
  needs: [obraz]
  script:
    - wget -qO- "https://github.com/anchore/syft/releases/download/v${WERSJA_SYFT}/syft_${WERSJA_SYFT}_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin syft
    - syft "$OBRAZ:$ZNACZNIK" -o cyclonedx-json=sbom.cdx.json
  artifacts:
    paths:
      - sbom.cdx.json
    expire_in: 1 month

podpis:
  stage: artefakt
  image: alpine:3.20
  needs: [obraz, sbom]
  id_tokens:
    VAULT_ID_TOKEN:
      aud: "$VAULT_SERVER_URL"
  secrets:
    COSIGN_PRIVATE_KEY:
      vault: badanie/cosign/key@kv
      token: $VAULT_ID_TOKEN
    COSIGN_PASSWORD:
      vault: badanie/cosign/password@kv
      token: $VAULT_ID_TOKEN
  before_script:
    - wget -qO /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/download/v${WERSJA_COSIGN}/cosign-linux-amd64"
    - chmod +x /usr/local/bin/cosign
  script:
    - SKROT=$(cat skrot-obrazu.txt)
    - echo "$CI_REGISTRY_PASSWORD" | cosign login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - cosign sign --key env://COSIGN_PRIVATE_KEY --yes "$SKROT"
    - cosign attest --key env://COSIGN_PRIVATE_KEY --predicate sbom.cdx.json --type cyclonedx --yes "$SKROT"
    - cosign verify --key cosign.pub "$SKROT"

# =============================================================================
# SRODOWISKO EFEMERYCZNE
# =============================================================================
srodowisko-efemeryczne:
  extends: .k8s_vault
  stage: srodowisko-efemeryczne
  needs: [podpis]
  environment:
    name: badanie/efemeryczne-$CI_PIPELINE_ID
    url: https://owasp-$CI_PIPELINE_ID.opscentre.pl
    on_stop: usun-srodowisko-efemeryczne
    auto_stop_in: 1 hour
  script:
    - kubectl -n "$K8S_NAMESPACE_EFEMERYCZNY" create deployment "juice-shop-$CI_PIPELINE_ID" --image="$OBRAZ:$ZNACZNIK"
    - kubectl -n "$K8S_NAMESPACE_EFEMERYCZNY" patch deployment "juice-shop-$CI_PIPELINE_ID" --type='json' -p='[{"op":"add","path":"/spec/template/spec/imagePullSecrets","value":[{"name":"gitlab-registry-secret"}]}]'
    - kubectl -n "$K8S_NAMESPACE_EFEMERYCZNY" expose deployment "juice-shop-$CI_PIPELINE_ID" --port=3000
    - |
      kubectl -n "$K8S_NAMESPACE_EFEMERYCZNY" apply -f - <<EOF
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: juice-shop-ephemeral-$CI_PIPELINE_ID
        annotations:
          nginx.ingress.kubernetes.io/backend-protocol: HTTP
          nginx.ingress.kubernetes.io/ssl-redirect: "true"
          nginx.ingress.kubernetes.io/configuration-snippet: |
            add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
            location = /robots.txt {
              return 200 "User-agent: *\\nDisallow: /\\n";
            }
      spec:
        ingressClassName: nginx
        tls:
        - hosts:
          - "owasp-$CI_PIPELINE_ID.opscentre.pl"
          secretName: opscentre-wildcard-tls
        rules:
        - host: "owasp-$CI_PIPELINE_ID.opscentre.pl"
          http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: "juice-shop-$CI_PIPELINE_ID"
                  port:
                    number: 3000
      EOF
    - kubectl -n "$K8S_NAMESPACE_EFEMERYCZNY" rollout status deployment "juice-shop-$CI_PIPELINE_ID" --timeout=180s

# =============================================================================
# TESTOWANIE DYNAMICZNE (DAST)
# =============================================================================
dast:
  stage: dast
  needs: [srodowisko-efemeryczne]

zap-krzyzowy:
  stage: dast
  image: 
    name: ghcr.io/zaproxy/zaproxy:$WERSJA_ZAP
    entrypoint: [""]
  needs: [srodowisko-efemeryczne]
  allow_failure: true
  script:
    - mkdir -p /zap/wrk && cd /zap/wrk
    - zap-baseline.py -t "$DAST_TARGET_URL" -J zap.json -r zap.html || true
    - cp /zap/wrk/zap.json "$CI_PROJECT_DIR/zap.json"
  artifacts:
    paths: [zap.json]
    when: always
    expire_in: 1 week

# =============================================================================
# SPRZATANIE PO SRODOWISKU EFEMERYCZNYM
# =============================================================================
usun-srodowisko-efemeryczne:
  extends: .k8s_vault
  stage: sprzatanie
  when: always
  environment:
    name: badanie/efemeryczne-$CI_PIPELINE_ID
    action: stop
  script:
    - kubectl -n "$K8S_NAMESPACE_EFEMERYCZNY" delete ingress "juice-shop-ephemeral-$CI_PIPELINE_ID" --ignore-not-found
    - kubectl -n "$K8S_NAMESPACE_EFEMERYCZNY" delete service "juice-shop-$CI_PIPELINE_ID" --ignore-not-found
    - kubectl -n "$K8S_NAMESPACE_EFEMERYCZNY" delete deployment "juice-shop-$CI_PIPELINE_ID" --ignore-not-found

# =============================================================================
# [E] BRAMKA PRZEDWDROZENIOWA
# =============================================================================
brama-integralnosci:
  stage: weryfikacja
  image: alpine:3.20
  needs: [podpis, container_scanning]
  before_script:
    - wget -qO /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/download/v${WERSJA_COSIGN}/cosign-linux-amd64"
    - chmod +x /usr/local/bin/cosign
  script:
    - SKROT=$(cat skrot-obrazu.txt)
    - echo "Weryfikacja podpisu artefaktu przed wdrozeniem produkcyjnym"
    - cosign verify --key cosign.pub "$SKROT"
    - echo "Weryfikacja atestacji zestawienia komponentow"
    - cosign verify-attestation --key cosign.pub --type cyclonedx "$SKROT"

# =============================================================================
# WDROZENIE PRODUKCYJNE
# =============================================================================
wdrozenie:
  extends: .k8s_vault
  stage: wdrozenie
  needs: [brama-integralnosci, dast]
  when: manual
  environment:
    name: badanie/referencyjny
    url: https://$APLIKACJA_HOST
  script:
    - kubectl -n "$K8S_NAMESPACE" set image deployment/juice-shop juice-shop="$OBRAZ:$ZNACZNIK"
    - kubectl -n "$K8S_NAMESPACE" rollout status deployment/juice-shop --timeout=180s

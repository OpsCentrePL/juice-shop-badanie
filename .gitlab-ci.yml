# =============================================================================
# WARIANT R (referencyjny) - wariant N uzupelniony o mechanizmy ekosystemowe
# do uzyskania pelnego pokrycia klas kontroli oraz mechanizmow zabezpieczajacych
# sam proces wytworczy.
#
# Rola badawcza wariantu:
#   a) wyznaczenie docelowego poziomu bezpieczenstwa osiagalnego na platformie,
#   b) kontrola krzyzowa detekcji - ustalenia narzedzi ekosystemowych, ktorych
#      nie zglosily mechanizmy natywne, wyznaczaja przyrost czulosci N -> R
#      stanowiacy podstawe rozstrzygniecia hipotezy H5.
#
# Kazde zadanie oznaczono etykieta [N] lub [E] zgodnie z kwalifikacja z zalacznika B.
# =============================================================================

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/SAST-IaC.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  # Szablon skanowania zaleznosci oparty na zestawieniu komponentow (SBOM).
  # Nazwa zweryfikowana dla GitLab 19.x. We wczesniejszych wersjach:
  #   Security/Dependency-Scanning.gitlab-ci.yml (analizator Gemnasium, przestarzaly od 17.9)
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml
  - template: Security/DAST.gitlab-ci.yml

# -----------------------------------------------------------------------------
# Domyslne srodowisko wykonawcze. Deklaracja obejmuje rowniez zadania pochodzace
# z dolaczonych szablonow, ktore same nie definiuja tagow.
# Wszystkie pomiary czasowe wykonywane sa na tej samej klasie runnera - warunek
# porownywalnosci serii pomiarowych (podrozdzial 5.8 pracy).
# -----------------------------------------------------------------------------
default:
  tags:
    - docker

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  OBRAZ: "$CI_REGISTRY_IMAGE/juice-shop"
  ZNACZNIK: "$CI_COMMIT_SHORT_SHA"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm-nocache"
  GITLAB_ADVANCED_SAST_ENABLED: 'true'
  SAST_EXCLUDED_PATHS: "test,tests,spec,node_modules,build"
  SECRET_DETECTION_HISTORIC_SCAN: 'true'
  # Domyslny plytki checkout (GIT_DEPTH=20) nie siegal commita SEC-05 -
  # patrz analogiczny komentarz w wariancie N.
  GIT_DEPTH: "100"
  CS_IMAGE: "$CI_REGISTRY_IMAGE/juice-shop:$CI_COMMIT_SHORT_SHA"
  CS_DOCKERFILE_PATH: "Dockerfile"
  DAST_TARGET_URL: "http://juice-shop-$CI_PIPELINE_ID.$K8S_NAMESPACE_EFEMERYCZNY.svc.cluster.local:3000"
  RUNNER_GENERATE_ARTIFACTS_METADATA: 'true'
  # --- magazyn poswiadczen (grupa W5) --------------------------------------
  # Nazwa roli, o ktora runner prosi przy logowaniu do Vaulta. Bez tej wartosci
  # Vault odrzuca zadanie komunikatem "missing role", poniewaz rola domyslna
  # nie zostala zdefiniowana. Adres serwera pochodzi ze zmiennej projektu.
  VAULT_AUTH_ROLE: badanie-potok
  VAULT_AUTH_PATH: jwt
  # Wersje narzedzi ekosystemowych przypiete do skrotu - wymog powtarzalnosci
  # pomiaru oraz przeciwdzialanie ryzyku CICD-SEC-3 (rozdzial 3.5.3).
  WERSJA_SEMGREP: "1.97.0"
  WERSJA_TRIVY: "0.58.1"
  WERSJA_GITLEAKS: "8.22.1"
  WERSJA_SYFT: "1.19.0"
  WERSJA_COSIGN: "2.4.1"
  WERSJA_ZAP: "2.16.0"

stages:
  - test
  - test-krzyzowy
  - obraz
  - artefakt
  - srodowisko-efemeryczne
  - dast
  - weryfikacja
  - wdrozenie

# =============================================================================
# [N] ANALIZY NATYWNE - jak w wariancie N
# =============================================================================
sast:
  stage: test
  needs: []

gitlab-advanced-sast:
  stage: test
  needs: []

# Nazwa rzeczywista zadania szablonu Security/SAST-IaC na tej instancji to
# kics-iac-sast, nie iac-sast - potwierdzone przez GET /pipelines/:id/jobs.
kics-iac-sast:
  stage: test
  needs: []

secret_detection:
  stage: test
  needs: []

dependency-scanning:
  stage: test
  needs: []

# =============================================================================
# [E] KONTROLA KRZYZOWA - narzedzia ekosystemowe.
# Zadania nie przerywaja potoku (allow_failure) - ich celem jest pomiar,
# a nie bramkowanie. Raporty trafiaja do artefaktow i sa agregowane skryptem
# pomiar/agreguj_raporty.py do wspolnej postaci.
# =============================================================================
semgrep-krzyzowy:
  stage: test-krzyzowy
  image: returntocorp/semgrep:$WERSJA_SEMGREP
  needs: []
  allow_failure: true
  script:
    - semgrep --config=p/security-audit --config=p/owasp-top-ten
      --sarif --output semgrep.sarif --metrics=off .
  artifacts:
    paths: [semgrep.sarif]
    when: always
    expire_in: 1 week

gitleaks-krzyzowy:
  stage: test-krzyzowy
  image: zricethezav/gitleaks:v$WERSJA_GITLEAKS
  needs: []
  allow_failure: true
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks detect --source . --report-format sarif --report-path gitleaks.sarif --exit-code 0
  artifacts:
    paths: [gitleaks.sarif]
    when: always
    expire_in: 1 week

trivy-iac-krzyzowy:
  stage: test-krzyzowy
  image: aquasec/trivy:$WERSJA_TRIVY
  needs: []
  allow_failure: true
  script:
    - trivy config --format sarif --output trivy-iac.sarif --exit-code 0 .
  artifacts:
    paths: [trivy-iac.sarif]
    when: always
    expire_in: 1 week

# =============================================================================
# OBRAZ KONTENEROWY
# =============================================================================
obraz:
  stage: obraz
  image: docker:27
  services:
    - docker:27-dind
  needs: []
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$OBRAZ:$ZNACZNIK" .
    - docker push "$OBRAZ:$ZNACZNIK"
    - docker image inspect "$OBRAZ:$ZNACZNIK" --format '{{index .RepoDigests 0}}' > skrot-obrazu.txt
  artifacts:
    paths:
      - skrot-obrazu.txt
      - artifacts-metadata.json
    expire_in: 1 week

container_scanning:
  stage: obraz
  needs: [obraz]

trivy-obraz-krzyzowy:
  stage: obraz
  image: aquasec/trivy:$WERSJA_TRIVY
  needs: [obraz]
  allow_failure: true
  script:
    - trivy image --format sarif --output trivy-obraz.sarif --exit-code 0 "$OBRAZ:$ZNACZNIK"
  artifacts:
    paths: [trivy-obraz.sarif]
    when: always
    expire_in: 1 week

# =============================================================================
# [E] ZESTAWIENIE KOMPONENTOW, PODPIS I PROWENIENCJA (grupa W5)
# =============================================================================
sbom:
  stage: artefakt
  image: anchore/syft:v$WERSJA_SYFT
  needs: [obraz]
  script:
    - syft "$OBRAZ:$ZNACZNIK" -o cyclonedx-json=sbom.cdx.json
  artifacts:
    paths: [sbom.cdx.json]
    expire_in: 1 month

podpis:
  stage: artefakt
  image: bitnami/cosign:$WERSJA_COSIGN
  needs: [obraz, sbom]
  # Podpis bezkluczowy: tozsamosc potoku poswiadczana tokenem OIDC,
  # bez przechowywania dlugotrwalego klucza prywatnego (wskaznik higieny poswiadczen).
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - SKROT=$(cat skrot-obrazu.txt)
    - cosign sign --yes "$SKROT"
    - cosign attest --yes --predicate sbom.cdx.json --type cyclonedx "$SKROT"
    - cosign verify --certificate-identity-regexp ".*" --certificate-oidc-issuer "$CI_SERVER_URL" "$SKROT"

# =============================================================================
# SRODOWISKO EFEMERYCZNE I WERYFIKACJA PRZEDWDROZENIOWA (faza 6)
# =============================================================================
srodowisko-efemeryczne:
  stage: srodowisko-efemeryczne
  image: bitnami/kubectl
  needs: [podpis]
  environment:
    name: badanie/efemeryczne-$CI_PIPELINE_ID
    url: http://juice-shop-$CI_PIPELINE_ID.$K8S_NAMESPACE_EFEMERYCZNY.svc.cluster.local:3000
    on_stop: usun-srodowisko-efemeryczne
    auto_stop_in: 1 hour
  script:
    - kubectl -n "$K8S_NAMESPACE_EFEMERYCZNY" create deployment "juice-shop-$CI_PIPELINE_ID" --image="$OBRAZ:$ZNACZNIK"
    - kubectl -n "$K8S_NAMESPACE_EFEMERYCZNY" expose deployment "juice-shop-$CI_PIPELINE_ID" --port=3000
    - kubectl -n "$K8S_NAMESPACE_EFEMERYCZNY" rollout status deployment "juice-shop-$CI_PIPELINE_ID" --timeout=180s

usun-srodowisko-efemeryczne:
  stage: weryfikacja
  image: bitnami/kubectl
  needs: [dast, zap-krzyzowy]
  when: always
  environment:
    name: badanie/efemeryczne-$CI_PIPELINE_ID
    action: stop
  script:
    - kubectl -n "$K8S_NAMESPACE_EFEMERYCZNY" delete deployment "juice-shop-$CI_PIPELINE_ID" --ignore-not-found
    - kubectl -n "$K8S_NAMESPACE_EFEMERYCZNY" delete service "juice-shop-$CI_PIPELINE_ID" --ignore-not-found

dast:
  stage: dast
  needs: [srodowisko-efemeryczne]

zap-krzyzowy:
  stage: dast
  image: ghcr.io/zaproxy/zaproxy:$WERSJA_ZAP
  needs: [srodowisko-efemeryczne]
  allow_failure: true
  script:
    - mkdir -p /zap/wrk && cd /zap/wrk
    - zap-baseline.py -t "$DAST_TARGET_URL" -J zap.json -r zap.html || true
    - cp /zap/wrk/zap.json "$CI_PROJECT_DIR/zap.json"
  artifacts:
    paths: [zap.json]
    when: always
    expire_in: 1 week

# =============================================================================
# [E] BRAMKA PRZEDWDROZENIOWA - weryfikacja podpisu i proweniencji.
# Zadanie realizuje scenariusze egzekwowania INT-01 oraz INT-02.
# =============================================================================
brama-integralnosci:
  stage: weryfikacja
  image: bitnami/cosign:$WERSJA_COSIGN
  needs: [podpis, container_scanning]
  script:
    - SKROT=$(cat skrot-obrazu.txt)
    - echo "Weryfikacja podpisu artefaktu przed wdrozeniem produkcyjnym"
    - cosign verify --certificate-identity-regexp ".*" --certificate-oidc-issuer "$CI_SERVER_URL" "$SKROT"
    - echo "Weryfikacja atestacji zestawienia komponentow"
    - cosign verify-attestation --type cyclonedx --certificate-identity-regexp ".*" --certificate-oidc-issuer "$CI_SERVER_URL" "$SKROT"

# =============================================================================
# WDROZENIE PRODUKCYJNE (faza 7 rozpoczyna sie po tym kroku)
# Poswiadczenia dostepowe pobierane z zewnetrznego magazynu w postaci
# wartosci krotkotrwalej, waznej wylacznie na czas wykonania zadania.
# =============================================================================
wdrozenie:
  stage: wdrozenie
  image: bitnami/kubectl
  needs: [brama-integralnosci, dast]
  when: manual
  environment:
    name: badanie/referencyjny
    url: https://$APLIKACJA_HOST
  id_tokens:
    VAULT_ID_TOKEN:
      aud: "$VAULT_SERVER_URL"
  secrets:
    KUBECONFIG_PRODUKCJA:
      vault: badanie/kubernetes/kubeconfig@kv
      token: $VAULT_ID_TOKEN
      file: true
  script:
    - export KUBECONFIG="$KUBECONFIG_PRODUKCJA"
    - kubectl -n "$K8S_NAMESPACE" set image deployment/juice-shop juice-shop="$OBRAZ:$ZNACZNIK"
    - kubectl -n "$K8S_NAMESPACE" rollout status deployment/juice-shop --timeout=180s

version: 0.2

# WARIANT R (referencyjny) - sekcja 5 dokumentu badawczego.
# Architektura zgodna z wariantem R na GitLab: statyczne skany -> build+push ->
# podpis+SBOM -> WDROZENIE EFEMERYCZNE (wlasna domena+TLS) -> ZAP aktywny na
# zywej aplikacji -> SPRZATANIE efemerycznego -> brama integralnosci (notation
# verify). Pomiar konczy sie na bramce - bez wdrozenia produkcyjnego (poza
# zakresem pomiaru, tak jak "wdrozenie: when manual" na GitLab).
# Wersje TAKIE SAME jak GitHub/GitLab: trivy:0.58.1, semgrep:1.97.0,
# gitleaks:v8.22.1. Notation zamiast Cosign (roznica narzedziowa, nie blad).

env:
  secrets-manager:
    SSH_PRIVATE_KEY: "juiceshop/codebuild-ssh-key:private_key"
    KUBECONFIG_CONTENT: "juiceshop/k8s-access:kubeconfig"
  variables:
    SSH_HOST: "server.mikolajmurawski.pl"
    SSH_USER: "mikolaj"
    SSH_PORT: "22"
    K8S_API_TARGET: "10.200.0.8:6443"
    LOCAL_TUNNEL_PORT: "16443"
    K8S_NAMESPACE_EFEMERYCZNY: "badanie-efemeryczne"
    LEGACY_MONITORING_TOKEN: "glpat-a1B2c3D4e5F6g7H8i9J0"
    SIGNER_PROFILE_ARN: "arn:aws:signer:eu-central-1:891377386127:/signing-profiles/juiceshop_badanie"

phases:
  install:
    commands:
      - 'echo "install phase - kubectl + przygotowanie SSH"'
      - curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      - chmod +x kubectl && mv kubectl /usr/local/bin/kubectl
      - mkdir -p ~/.ssh
      - echo "$SSH_PRIVATE_KEY" > ~/.ssh/codebuild_deploy_key
      - chmod 600 ~/.ssh/codebuild_deploy_key
      - ssh-keyscan -4 -T 10 -p $SSH_PORT $SSH_HOST >> ~/.ssh/known_hosts || true
      - 'test -s ~/.ssh/known_hosts && echo "known_hosts OK" || (echo "known_hosts pusty - blad" && exit 1)'
      - 'echo "install phase - Notation CLI + AWS Signer plugin"'
      - wget -q https://d2hvyiie56hcat.cloudfront.net/linux/amd64/installer/deb/latest/aws-signer-notation-cli_amd64.deb
      - dpkg -i aws-signer-notation-cli_amd64.deb
      - notation version
      - 'echo "install phase - trust policy dla notation verify (bramka integralnosci)"'
      - 'echo "{\"version\":\"1.0\",\"trustPolicies\":[{\"name\":\"aws-signer-tp\",\"registryScopes\":[\"*\"],\"signatureVerification\":{\"level\":\"strict\"},\"trustStores\":[\"signingAuthority:aws-signer-ts\"],\"trustedIdentities\":[\"${SIGNER_PROFILE_ARN}\"]}]}" > trustpolicy.json'
      - notation policy import trustpolicy.json
      - 'echo "install phase - Syft (SBOM)"'
      - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - syft version

  pre_build:
    commands:
      - 'echo "pre_build phase - pelna historia git (wymagane dla Gitleaks - SEC-05)"'
      - git rev-parse --is-shallow-repository
      - git fetch --unshallow || echo "juz pelna historia lub fetch niepotrzebny"
      - git log --oneline | wc -l
      - 'echo "pre_build phase - logowanie do ECR"'
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPOSITORY_URI
      - 'echo "pre_build phase - tunel SSH do k8s API"'
      - ssh -4 -i ~/.ssh/codebuild_deploy_key -p $SSH_PORT -f -N -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -L ${LOCAL_TUNNEL_PORT}:${K8S_API_TARGET} ${SSH_USER}@${SSH_HOST}
      - sleep 3
      - echo "$KUBECONFIG_CONTENT" > kubeconfig-aws.yaml
      - sed -i "s#https://${K8S_API_TARGET}#https://127.0.0.1:${LOCAL_TUNNEL_PORT}#" kubeconfig-aws.yaml
      - 'sed -i "s|certificate-authority-data:|tls-server-name: ${K8S_API_TARGET%%:*}\n    certificate-authority-data:|" kubeconfig-aws.yaml'
      - export KUBECONFIG=$PWD/kubeconfig-aws.yaml
      - 'echo "pre_build phase - sanity check dostepu do namespace efemerycznego"'
      - kubectl -n $K8S_NAMESPACE_EFEMERYCZNY auth can-i create deployments
      - kubectl -n $K8S_NAMESPACE_EFEMERYCZNY auth can-i create ingresses
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}
      - echo "IMAGE_TAG=$IMAGE_TAG" > image_tag.env
      - 'echo "pre_build phase - Semgrep (SAST)"'
      - 'docker run --rm -v $(pwd):/src semgrep/semgrep:1.97.0 semgrep --config=p/security-audit --config=p/owasp-top-ten --sarif -o /src/semgrep-report.sarif /src || echo "semgrep zakonczony (kod niezerowy = znaleziska, nie blad)"'
      - 'echo "pre_build phase - Gitleaks (sekrety, pelna historia)"'
      - 'docker run --rm -v $(pwd):/repo zricethezav/gitleaks:v8.22.1 detect --source=/repo --report-format=json --report-path=/repo/gitleaks-report.json --no-banner || echo "gitleaks zakonczony (kod niezerowy = znaleziska, nie blad)"'
      - 'echo "pre_build phase - Trivy config (IaC)"'
      - 'docker run --rm -v $(pwd):/src aquasec/trivy:0.58.1 config --format json --output /src/trivy-config-report.json /src || echo "trivy config zakonczony"'

  build:
    commands:
      - 'echo "build phase - docker build --no-cache"'
      - . ./image_tag.env
      - docker build --no-cache -t ${ECR_REPOSITORY_URI}:${IMAGE_TAG} -t ${ECR_REPOSITORY_URI}:latest .

  post_build:
    commands:
      - 'echo "post_build phase - push obrazu"'
      - . ./image_tag.env
      - docker push ${ECR_REPOSITORY_URI}:${IMAGE_TAG}
      - docker push ${ECR_REPOSITORY_URI}:latest
      - 'echo "post_build phase - Trivy image (skan obrazu)"'
      - 'docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v $(pwd):/out aquasec/trivy:0.58.1 image --format json --output /out/trivy-image-report.json ${ECR_REPOSITORY_URI}:${IMAGE_TAG} || echo "trivy image zakonczony"'
      - 'echo "post_build phase - Syft SBOM (CycloneDX)"'
      - syft ${ECR_REPOSITORY_URI}:${IMAGE_TAG} -o cyclonedx-json=sbom.cyclonedx.json
      - 'echo "post_build phase - podpisywanie obrazu AWS Signer/Notation (INT-01)"'
      - IMAGE_DIGEST=$(aws ecr describe-images --repository-name ${ECR_REPOSITORY_URI#*/} --image-ids imageTag=${IMAGE_TAG} --query 'imageDetails[0].imageDigest' --output text)
      - notation sign ${ECR_REPOSITORY_URI}@${IMAGE_DIGEST} --plugin "com.amazonaws.signer.notation.plugin" --id "${SIGNER_PROFILE_ARN}"
      - export KUBECONFIG=$PWD/kubeconfig-aws.yaml
      - EFEMER_NAZWA=juice-shop-aws-${CODEBUILD_BUILD_NUMBER}
      - EFEMER_DOMENA=owasp-aws-${CODEBUILD_BUILD_NUMBER}.opscentre.pl
      - echo "EFEMER_NAZWA=$EFEMER_NAZWA" >> image_tag.env
      - echo "EFEMER_DOMENA=$EFEMER_DOMENA" >> image_tag.env
      - 'echo "post_build phase - srodowisko efemeryczne: sekret ECR"'
      - 'kubectl -n $K8S_NAMESPACE_EFEMERYCZNY create secret docker-registry ecr-pull-secret --docker-server=${ECR_REPOSITORY_URI%%/*} --docker-username=AWS --docker-password=$(aws ecr get-login-password --region $AWS_DEFAULT_REGION) --dry-run=client -o yaml | kubectl apply -f -'
      - 'echo "post_build phase - srodowisko efemeryczne: deployment+service+ingress"'
      - kubectl -n $K8S_NAMESPACE_EFEMERYCZNY create deployment ${EFEMER_NAZWA} --image=${ECR_REPOSITORY_URI}@${IMAGE_DIGEST}
      - 'kubectl -n $K8S_NAMESPACE_EFEMERYCZNY patch deployment ${EFEMER_NAZWA} --type=json -p=''[{"op":"add","path":"/spec/template/spec/imagePullSecrets","value":[{"name":"ecr-pull-secret"}]}]'''
      - kubectl -n $K8S_NAMESPACE_EFEMERYCZNY expose deployment ${EFEMER_NAZWA} --port=3000
      - kubectl -n $K8S_NAMESPACE_EFEMERYCZNY create ingress ${EFEMER_NAZWA} --class=nginx --rule="${EFEMER_DOMENA}/*=${EFEMER_NAZWA}:3000,tls=opscentre-wildcard-tls"
      - kubectl -n $K8S_NAMESPACE_EFEMERYCZNY annotate ingress ${EFEMER_NAZWA} nginx.ingress.kubernetes.io/backend-protocol=HTTP nginx.ingress.kubernetes.io/ssl-redirect="true"
      - kubectl -n $K8S_NAMESPACE_EFEMERYCZNY rollout status deployment/${EFEMER_NAZWA} --timeout=180s
      - 'echo "post_build phase - czekam az domena zacznie odpowiadac"'
      - 'for i in $(seq 1 12); do curl -skf -o /dev/null "https://${EFEMER_DOMENA}/" && break || sleep 5; done'
      - 'echo "post_build phase - OWASP ZAP aktywny skan (zap-full-scan.py) na srodowisku efemerycznym"'
      - 'docker run --rm -v $(pwd):/zap/wrk/:rw ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py -t https://${EFEMER_DOMENA}/ -J zap-report.json -r zap-report.html || echo "zap zakonczony (kod niezerowy = znaleziska, nie blad)"'
      - 'echo "post_build phase - sprzatanie srodowiska efemerycznego"'
      - kubectl -n $K8S_NAMESPACE_EFEMERYCZNY delete ingress ${EFEMER_NAZWA} --ignore-not-found
      - kubectl -n $K8S_NAMESPACE_EFEMERYCZNY delete service ${EFEMER_NAZWA} --ignore-not-found
      - kubectl -n $K8S_NAMESPACE_EFEMERYCZNY delete deployment ${EFEMER_NAZWA} --ignore-not-found
      - 'echo "post_build phase - brama integralnosci (notation verify) - koniec pomiaru"'
      - notation verify ${ECR_REPOSITORY_URI}@${IMAGE_DIGEST}
      - 'echo "post_build phase - gotowe: statyczne+obraz+DAST+podpis zweryfikowane, bez wdrozenia produkcyjnego (poza zakresem pomiaru)"'

artifacts:
  files:
    - image_tag.env
    - semgrep-report.sarif
    - gitleaks-report.json
    - trivy-config-report.json
    - trivy-image-report.json
    - sbom.cyclonedx.json
    - zap-report.json
    - zap-report.html

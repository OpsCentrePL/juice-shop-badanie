name: badanie-K

on:
  push:
    branches:
      - badanie/wzorzec
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

env:
  OBRAZ: ghcr.io/opscentrepl/juice-shop
  ZNACZNIK: ${{ github.sha }}
  VAULT_ADDR: https://vault.opscentre.pl
  K8S_NAMESPACE: badanie-prod

jobs:
  obraz:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zaloguj do GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Zbuduj i wypchnij obraz
        run: |
          docker build --no-cache -t "$OBRAZ:$ZNACZNIK" .
          docker push "$OBRAZ:$ZNACZNIK"

  wdrozenie:
    runs-on: [self-hosted, Linux, X64]
    container:
      image: hashicorp/vault:1.18
    needs: [obraz]
    environment:
      name: badanie/kontrolny
    steps:
      - name: Zainstaluj zależności
        run: apk add --no-cache curl jq kubectl

      - name: Zaloguj do Vault i pobierz KUBECONFIG
        run: |
          # 1. Pobierz token OIDC z GitHub Actions
          GH_TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)

          # 2. Zaloguj do Vault
          VAULT_RESP=$(curl -sSL --request POST \
            --data "{\"role\": \"badanie-potok\", \"jwt\": \"$GH_TOKEN\"}" \
            "$VAULT_ADDR/v1/auth/github-jwt/login")

          VAULT_TOKEN=$(echo "$VAULT_RESP" | jq -r .auth.client_token)

          if [ -z "$VAULT_TOKEN" ] || [ "$VAULT_TOKEN" = "null" ]; then
            echo "::error::Błąd logowania do Vault: $VAULT_RESP"
            exit 1
          fi
          echo "::add-mask::$VAULT_TOKEN"

          # 3. Pobierz sekret z właściwej ścieżki badanie/kubernetes (KV v2)
          SECRET_JSON=$(curl -sSL -H "X-Vault-Token: $VAULT_TOKEN" \
            "$VAULT_ADDR/v1/kv/data/badanie/kubernetes")

          # 4. Bezpieczne wyciągnięcie wartości bez crashowania jq
          KUBECFG=$(echo "$SECRET_JSON" | jq -r '
            if .data.data? then
              .data.data.config // .data.data.kubeconfig // (.data.data | to_entries[0]?.value) // empty
            else
              empty
            end
          ')

          echo "$KUBECFG" > /tmp/kubeconfig

          # 5. Weryfikacja
          if [ -z "$KUBECFG" ] || [ "$KUBECFG" = "null" ] || [ ! -s /tmp/kubeconfig ]; then
            echo "::error::Nie udało się pobrać KUBECONFIG z Vault."
            echo "Odpowiedź Vault: $SECRET_JSON"
            exit 1
          fi

          echo "KUBECONFIG=/tmp/kubeconfig" >> "$GITHUB_ENV"

      - name: Wdróż obraz
        run: |
          kubectl -n "$K8S_NAMESPACE" set image deployment/juice-shop juice-shop="$OBRAZ:$ZNACZNIK"
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/juice-shop --timeout=180s

      - name: Wyczyść tymczasowy kubeconfig
        if: always()
        run: rm -f /tmp/kubeconfig
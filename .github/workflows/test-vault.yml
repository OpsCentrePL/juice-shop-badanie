name: Debug-ZAP

on:
  push:
    branches:
      - debug
  workflow_dispatch:

jobs:
  zap-izolowany:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    container:
      # Używamy oficjalnego obrazu ZAP, wymuszając uprawnienia roota, 
      # aby uniknąć problemów z zapisem w /zap/wrk
      image: zaproxy/zap-stable
      options: --user root --no-healthcheck
    steps:
      - name: Skanowanie DAST przy użyciu OWASP ZAP Baseline
        id: zap
        shell: bash
        run: |
          set -uo pipefail

          # Hardkodowany, bezpieczny adres do przetestowania działania samego skanera
          DAST_TARGET_URL="https://example.com"
          
          echo "Rozpoczynam skanowanie testowe adresu: $DAST_TARGET_URL"

          # Tworzymy wewnątrz kontenera katalog, do którego skrypt ZAP ma natywnie zapisywać raporty
          mkdir -p /zap/wrk

          # Używamy pełnej bezwzględnej ścieżki do skryptu bazowego i włączamy tryb debug (-d)
          set +e
          /zap/zap-baseline.py \
            -t "$DAST_TARGET_URL" \
            -a \
            -d \
            -J report.json \
            -w report.md \
            -r report.html
          ZAP_RC=$?
          set -e

          echo "ZAP_EXIT_CODE=$ZAP_RC" >> "$GITHUB_ENV"
          echo "Kod zakończenia ZAP: $ZAP_RC"

          # Przenosimy raporty bezpośrednio do GITHUB_WORKSPACE, aby GitHub Actions miał do nich dostęp
          cp /zap/wrk/report.* "$GITHUB_WORKSPACE/" || true

          # Wymuszamy exit 0, aby skaner nie "wywalił" joba, zanim przeanalizujemy kod wyjścia
          exit 0

      - name: Zapisz raport ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-debug
          path: |
            report.html
            report.md
            report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Sprawdź poprawność wykonania ZAP
        if: always()
        shell: bash
        run: |
          case "${ZAP_EXIT_CODE:-3}" in
            0)
              echo "ZAP: Skan zakończony pomyślnie, brak ostrzeżeń."
              ;;
            1)
              echo "ZAP: Skan zakończony — wykryto alerty bezpieczeństwa (FAIL)."
              ;;
            2)
              echo "ZAP: Skan zakończony — wykryto ostrzeżenia (WARN)."
              ;;
            *)
              echo "::error::ZAP nie wykonał skanu poprawnie (kod błędu: ${ZAP_EXIT_CODE:-brak}). Skrypt nie uruchomił się lub wystąpił błąd sieciowy."
              exit 1
              ;;
          esac
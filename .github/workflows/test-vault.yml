name: badanie-N

on:
  push:
    branches:
      - badanie/wzorzec
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write
  security-events: write
  attestations: write

env:
  OBRAZ: ghcr.io/opscentrepl/juice-shop-badanie
  ZNACZNIK: ${{ github.sha }}
  VAULT_ADDR: https://vault.opscentre.pl
  K8S_NAMESPACE: badanie-prod

jobs:
  budowanie:
    runs-on: [self-hosted, Linux, X64]
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/
            frontend/dist/
          retention-days: 1
      - if: always()
        run: chmod -R 777 . "$GITHUB_WORKSPACE"

  sast:
    runs-on: [self-hosted, Linux, X64]
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Trust repository directory in Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
      - if: always()
        run: chmod -R 777 . "$GITHUB_WORKSPACE"

  obraz:
    runs-on: [self-hosted, Linux, X64]
    needs: [budowanie]
    container:
      image: docker:27-cli
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Zaloguj do GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Zbuduj i wypchnij obraz
        id: build
        run: |
          docker build -t "$OBRAZ:$ZNACZNIK" .
          docker push "$OBRAZ:$ZNACZNIK"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$OBRAZ:$ZNACZNIK" | cut -d'@' -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - if: always()
        run: chmod -R 777 . "$GITHUB_WORKSPACE"

  atestacja:
    runs-on: [self-hosted, Linux, X64]
    needs: [obraz]
    container:
      image: node:22-bookworm
    steps:
      - name: Generuj natywną atestację pochodzenia (build provenance / Sigstore)
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.OBRAZ }}
          subject-digest: ${{ needs.obraz.outputs.digest }}
          push-to-registry: false
      - if: always()
        run: chmod -R 777 . "$GITHUB_WORKSPACE"

  wdrozenie:
    runs-on: [self-hosted, Linux, X64]
    container:
      image: hashicorp/vault:1.18
    needs: [obraz, sast, atestacja]
    environment:
      name: badanie/natywny
    steps:
      - name: Zainstaluj zależności
        run: apk add --no-cache curl jq kubectl
      - name: Zaloguj do Vault i pobierz KUBECONFIG
        run: |
          GH_TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          VAULT_RESP=$(curl -sSL --request POST \
            --data "{\"role\": \"badanie-potok\", \"jwt\": \"$GH_TOKEN\"}" \
            "$VAULT_ADDR/v1/auth/github-jwt/login")
          VAULT_TOKEN=$(echo "$VAULT_RESP" | jq -r .auth.client_token)
          if [ -z "$VAULT_TOKEN" ] || [ "$VAULT_TOKEN" = "null" ]; then
            echo "::error::Błąd logowania do Vault: $VAULT_RESP"
            exit 1
          fi
          echo "::add-mask::$VAULT_TOKEN"
          SECRET_JSON=$(curl -sSL -H "X-Vault-Token: $VAULT_TOKEN" \
            "$VAULT_ADDR/v1/kv/data/badanie/kubernetes")
          KUBECFG=$(echo "$SECRET_JSON" | jq -r '
            if .data.data? then
              .data.data.config // .data.data.kubeconfig // (.data.data | to_entries[0]?.value) // empty
            else
              empty
            end
          ')
          echo "$KUBECFG" > /tmp/kubeconfig
          if [ -z "$KUBECFG" ] || [ "$KUBECFG" = "null" ] || [ ! -s /tmp/kubeconfig ]; then
            echo "::error::Nie udało się pobrać KUBECONFIG z Vault."
            exit 1
          fi
          echo "KUBECONFIG=/tmp/kubeconfig" >> "$GITHUB_ENV"
      - name: Wdróż obraz
        run: |
          kubectl -n "$K8S_NAMESPACE" set image deployment/juice-shop juice-shop="$OBRAZ:$ZNACZNIK"
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/juice-shop --timeout=180s
      - if: always()
        run: rm -f /tmp/kubeconfig

permissions:
  id-token: write
  contents: read
  packages: read

# ... (reszta pliku bez zmian)
name: Debug-Brama

on:
  push:
    branches:
      - debug  # Zmień na dokładną nazwę swojej gałęzi, np. debug/brama
  workflow_dispatch: # Pozwala na reczne odpalenie z poziomu interfejsu GitHuba

permissions:
  id-token: write
  contents: read
  packages: read

env:
  # Hardcoded obraz z Twojego zrzutu ekranu
  OBRAZ_TESTOWY: ghcr.io/opscentrepl/juice-shop-badanie@sha256:d103f943b6fc74baa630706c4ce5d2dab14d99a8d9b701e7c539dea12a60b635
  VAULT_ADDR: https://vault.opscentre.pl

jobs:
  brama-izolowana:
    # BRAK DYREKTYWY 'container' - uruchamiamy bezposrednio na hoście runnera
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Instalacja Cosign (oficjalna akcja zamiast wget)
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.4.1'

      - name: Zaloguj do rejestru GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pobierz klucz publiczny z Vault i weryfikuj
        run: |
          echo "1. Uwierzytelnianie OIDC do Vaulta..."
          GH_TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$VAULT_ADDR" | jq -r .value)

          VAULT_RESP=$(curl -sSL --request POST \
            --data "{\"role\": \"badanie-potok\", \"jwt\": \"$GH_TOKEN\"}" \
            "$VAULT_ADDR/v1/auth/github-jwt/login")

          VAULT_TOKEN=$(echo "$VAULT_RESP" | jq -r .auth.client_token)
          echo "::add-mask::$VAULT_TOKEN"

          echo "2. Pobieranie klucza publicznego..."
          SECRET_JSON=$(curl -sSL -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/kv/data/badanie/cosign")
          
          # Ponieważ do weryfikacji potrzebny jest tylko klucz publiczny, wyciągamy go z klucza prywatnego (Cosign to wspiera) lub pobieramy
          echo "$SECRET_JSON" | jq -r '.data.data.key // empty' > cosign.pub

          echo "3. Weryfikacja podpisu..."
          cosign verify --key cosign.pub "$OBRAZ_TESTOWY"

          echo "4. Weryfikacja atestacji SBOM..."
          cosign verify-attestation --key cosign.pub --type cyclonedx "$OBRAZ_TESTOWY"

          echo "5. Gotowe. Czyszczenie..."
          rm -f cosign.pub
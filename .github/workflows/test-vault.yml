name: Debug-Brama

on:
  push:
    branches:
      - debug
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: read

env:
  OBRAZ_TESTOWY: ghcr.io/opscentrepl/juice-shop-badanie@sha256:d103f943b6fc74baa630706c4ce5d2dab14d99a8d9b701e7c539dea12a60b635
  VAULT_ADDR: https://vault.opscentre.pl

jobs:
  brama-izolowana:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Instalacja Cosign
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.4.1'

      - name: Pobierz klucz z Vault, wygeneruj publiczny i weryfikuj
        run: |
          # ROZWIĄZANIE PROBLEMU Z ZAWIESZANIEM: wymuszamy użycie świeżego katalogu na cache
          export SIGSTORE_CACHE_DIR="$(mktemp -d)"

          echo "1. Uwierzytelnianie OIDC do Vaulta..."
          GH_TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$VAULT_ADDR" | jq -r .value)

          VAULT_RESP=$(curl -sSL --request POST \
            --data "{\"role\": \"badanie-potok\", \"jwt\": \"$GH_TOKEN\"}" \
            "$VAULT_ADDR/v1/auth/github-jwt/login")

          VAULT_TOKEN=$(echo "$VAULT_RESP" | jq -r .auth.client_token)
          echo "::add-mask::$VAULT_TOKEN"

          echo "2. Pobieranie klucza prywatnego z Vault..."
          SECRET_JSON=$(curl -sSL -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/kv/data/badanie/cosign")
          
          TMP_KEY="vault-cosign.key"
          TMP_PUB="vault-cosign.pub"
          
          echo "$SECRET_JSON" | jq -r '.data.data.key // empty' > "$TMP_KEY"
          COSIGN_PASSWORD=$(echo "$SECRET_JSON" | jq -r '.data.data.password // .data.data.cosign_password // .data.data.pass // empty')
          export COSIGN_PASSWORD
          echo "::add-mask::$COSIGN_PASSWORD"

          echo "3. Generowanie klucza publicznego..."
          cosign public-key --key "$TMP_KEY" --outfile "$TMP_PUB"

          echo "4. Uwierzytelnianie do GHCR..."
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin

          echo "5. Weryfikacja podpisu..."
          cosign verify --key "$TMP_PUB" "$OBRAZ_TESTOWY"

          echo "6. Weryfikacja atestacji SBOM..."
          cosign verify-attestation --key "$TMP_PUB" --type cyclonedx "$OBRAZ_TESTOWY"

          echo "7. Gotowe. Czyszczenie..."
          rm -f "$TMP_KEY" "$TMP_PUB"
          rm -rf "$SIGSTORE_CACHE_DIR"
          exit 0
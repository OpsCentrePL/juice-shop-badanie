name: Debug-Brama

on:
  push:
    branches:
      - debug
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: read

env:
  OBRAZ_TESTOWY: ghcr.io/opscentrepl/juice-shop-badanie@sha256:d103f943b6fc74baa630706c4ce5d2dab14d99a8d9b701e7c539dea12a60b635
  VAULT_ADDR: https://vault.opscentre.pl

jobs:
  brama-izolowana:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5

    steps:
      - name: Instalacja Cosign
        uses: sigstore/cosign-installer@v3.10.1
        with:
          cosign-release: "v2.6.2"

      - name: Sprawdź wersję
        run: cosign version

      - name: Pobierz klucz publiczny
        shell: bash
        run: |
          set -Eeuo pipefail

          COSIGN_DIR="$(mktemp -d "${RUNNER_TEMP}/cosign.XXXXXX")"
          TMP_KEY="${COSIGN_DIR}/cosign.key"
          TMP_PUB="${COSIGN_DIR}/cosign.pub"

          echo "COSIGN_DIR=$COSIGN_DIR" >> "$GITHUB_ENV"
          echo "COSIGN_PUB=$TMP_PUB" >> "$GITHUB_ENV"

          echo "1. Pobieranie tokenu OIDC GitHub..."

          GH_TOKEN="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${VAULT_ADDR}" \
            | jq -er '.value'
          )"

          echo "2. Logowanie OIDC do Vault..."

          VAULT_RESP="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              --request POST \
              --header "Content-Type: application/json" \
              --data "$(jq -nc \
                --arg role "badanie-potok" \
                --arg jwt "$GH_TOKEN" \
                '{role:$role,jwt:$jwt}')" \
              "${VAULT_ADDR}/v1/auth/github-jwt/login"
          )"

          VAULT_TOKEN="$(jq -er '.auth.client_token' <<< "$VAULT_RESP")"
          echo "::add-mask::$VAULT_TOKEN"

          echo "3. Pobieranie klucza z Vault..."

          SECRET_JSON="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              -H "X-Vault-Token: $VAULT_TOKEN" \
              "${VAULT_ADDR}/v1/kv/data/badanie/cosign"
          )"

          jq -er '.data.data.key' <<< "$SECRET_JSON" > "$TMP_KEY"

          COSIGN_PASSWORD="$(
            jq -er '
              .data.data.password //
              .data.data.cosign_password //
              .data.data.pass
            ' <<< "$SECRET_JSON"
          )"

          export COSIGN_PASSWORD
          echo "::add-mask::$COSIGN_PASSWORD"

          chmod 600 "$TMP_KEY"

          echo "4. Generowanie klucza publicznego..."

          cosign public-key \
            --key "$TMP_KEY" \
            --outfile "$TMP_PUB"

          # Klucz prywatny od tego miejsca nie jest już potrzebny.
          rm -f "$TMP_KEY"
          unset COSIGN_PASSWORD

          test -s "$TMP_PUB"

      - name: Uwierzytelnianie do GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          printf '%s' "$GHCR_TOKEN" |
            cosign login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Weryfikacja podpisu
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Weryfikacja podpisu obrazu..."

          timeout -k 5s 45s \
            cosign verify \
              --timeout 30s \
              --key "$COSIGN_PUB" \
              "$OBRAZ_TESTOWY"

          echo "Podpis OK"

      - name: Weryfikacja atestacji SBOM
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Weryfikacja atestacji CycloneDX..."

          timeout -k 5s 45s \
            cosign verify-attestation \
              --timeout 30s \
              --key "$COSIGN_PUB" \
              --type cyclonedx \
              "$OBRAZ_TESTOWY"

          echo "Atestacja OK"

      - name: Czyszczenie
        if: always()
        shell: bash
        run: |
          if [[ -n "${COSIGN_DIR:-}" ]]; then
            rm -rf "$COSIGN_DIR"
          fi
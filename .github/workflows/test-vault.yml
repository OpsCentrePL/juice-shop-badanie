name: badanie-K

on:
  push:
    branches:
      - badanie/wzorzec

permissions:
  id-token: write
  contents: read
  packages: write

env:
  OBRAZ: ghcr.io/opscentrepl/juice-shop
  ZNACZNIK: ${{ github.sha }}
  VAULT_ADDR: https://vault.opscentre.pl
  K8S_NAMESPACE: badanie-kontrolny

jobs:
  budowanie:
    runs-on: [self-hosted, Linux, X64]
    container:
      image: node:22
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Instalacja zależności
        run: npm install --no-audit --no-fund

      - name: Budowanie aplikacji
        run: npm run build

      - name: Wypchnij artefakty
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/
            frontend/dist/
          retention-days: 1

      - name: Przywróć uprawnienia dla hosta runnera
        if: always()
        run: chmod -R 777 .

  obraz:
    runs-on: [self-hosted, Linux, X64]
    needs: [budowanie]
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Pobierz zbudowane pliki
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Zaloguj do GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Zbuduj i wypchnij obraz
        run: |
          docker build -t "$OBRAZ:$ZNACZNIK" .
          docker push "$OBRAZ:$ZNACZNIK"

  wdrozenie:
    runs-on: [self-hosted, Linux, X64]
    container:
      image: hashicorp/vault:1.18
    needs: [obraz]
    environment:
      name: badanie/kontrolny
    steps:
      - name: Zainstaluj zależności
        run: apk add --no-cache curl jq kubectl

      - name: Zaloguj do Vault i pobierz KUBECONFIG
        run: |
          # 1. Pobierz token OIDC z GitHub Actions
          GH_TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)

          # 2. Zaloguj do Vault i zamaskuj token w logach
          VAULT_TOKEN=$(curl -sSL --request POST \
            --data "{\"role\": \"badanie-potok\", \"jwt\": \"$GH_TOKEN\"}" \
            "$VAULT_ADDR/v1/auth/github-jwt/login" | jq -r .auth.client_token)
          echo "::add-mask::$VAULT_TOKEN"

          # 3. Pobierz kubeconfig bezpośrednio przez REST API (KV v2)
          curl -sSL -H "X-Vault-Token: $VAULT_TOKEN" \
            "$VAULT_ADDR/v1/kv/data/badanie/kubernetes/kubeconfig" \
            | jq -r '.data.data.config' > /tmp/kubeconfig

          # Sprawdź, czy kubeconfig nie jest pusty
          if [ ! -s /tmp/kubeconfig ] || [ "$(cat /tmp/kubeconfig)" = "null" ]; then
            echo "Błąd: Nie udało się pobrać kubeconfig z Vault (plik jest pusty lub null)."
            exit 1
          fi

          echo "KUBECONFIG=/tmp/kubeconfig" >> "$GITHUB_ENV"

      - name: Wdróż obraz
        run: |
          kubectl -n "$K8S_NAMESPACE" set image deployment/juice-shop juice-shop="$OBRAZ:$ZNACZNIK"
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/juice-shop --timeout=180s

      - name: Wyczyść tymczasowy kubeconfig
        if: always()
        run: rm -f /tmp/kubeconfig
